# Render Blueprint for the NetPulse backend.
#
# Render only auto-discovers a Blueprint at the repository root, so this file
# lives here rather than in backend/. `rootDir` scopes every command below to
# backend/, which is clean because there is no root package.json or workspace:
# backend/ is standalone with its own lockfile.
#
# See "Deploying to Render" in README.md for the manual dashboard steps.

services:
  - type: web
    name: netpulse-backend
    runtime: node
    rootDir: backend

    # Free, chosen on cost. The technical case for a paid instance is real and
    # unchanged: this is a long-running Horizon poller, and a Free instance
    # spins down after roughly 15 minutes without inbound traffic, which stops
    # ingestion and drops every connected WebSocket client. It spins back up on
    # the next HTTP request or WebSocket connection, taking about a minute.
    #
    # So ingestion is not continuous, and a visitor arriving at a cold service
    # waits out the spin-up before seeing anything. The live view still works,
    # which is what the dashboard is for. Nothing in backend/src/ handles this
    # specially and nothing needs to: the poller reconnects to Horizon with
    # backoff at start-up, and the frontend falls back to REST polling whenever
    # the socket is unavailable.
    #
    # Note also the workspace-wide allowance of 750 Free instance-hours per
    # month. A calendar month is about 730 hours, so one continuously-awake
    # service fits — but only one.
    plan: free

    # `--include=dev` is explicit because the build needs TypeScript, which is
    # a devDependency, and NODE_ENV=production below can otherwise cause npm to
    # omit dev dependencies and leave `tsc` missing at build time.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    # Existing route in backend/src/index.ts; returns 200 {"status":"ok"}.
    healthCheckPath: /healthz

    envVars:
      # Pinned to the version CI runs. package.json `engines` also permits
      # >=26, but better-sqlite3 is a native module that depends on prebuilt
      # binaries, and 24 is the version this lockfile is proven against.
      - key: NODE_VERSION
        value: "24"

      # Express omits error stack traces from responses in production.
      - key: NODE_ENV
        value: production

      # Origins allowed to call the REST API and to open the /ws WebSocket.
      # `sync: false` makes Render prompt for the value at deploy time instead
      # of committing a domain here. Set it to the frontend's origin once that
      # is known; see "Allowed Origins" in README.md for the accepted formats.
      - key: CORS_ORIGIN
        sync: false

# Not configured here, on purpose:
#
# - No `disk:`. Free instances cannot attach one, so SQLite lives on ephemeral
#   storage at the default ./data/netpulse.db and is discarded whenever the
#   service restarts or spins down. The consequence is that the `/api/trends`
#   30d, 90d and 1y ranges never populate. Revisiting this needs a paid
#   instance first; see #188.
#
# - No `region`. Render defaults to Oregon; pick another in the dashboard if
#   latency to Horizon or to the frontend's region matters.
#
# - HORIZON_URL, POLL_INTERVAL_MS, LOG_LEVEL, SHUTDOWN_TIMEOUT_MS and
#   DATABASE_PATH are all omitted because their in-code defaults are already
#   correct for this deployment. See backend/.env.example to override any.
