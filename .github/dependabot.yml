version: 2

# There is no root package.json: backend/ and frontend/ are independent installs
# with separate lockfiles, and CI type-checks and tests them as separate jobs.
# So each gets its own npm entry rather than one root entry with workspaces.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    # TypeScript 7.0 is the Go rewrite of the compiler (typescript-go), not an
    # incremental release. Adopting it is a deliberate migration, not a routine
    # bump, so hold majors here and let minor/patch flow normally.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    # react/react-dom and their @types must move as one unit: react-dom@N
    # requires react@N, and @types/react-dom@N peer-depends on @types/react@^N.
    # Split PRs are unbuildable by construction (npm ci fails with ERESOLVE).
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @vitejs/plugin-react declares a peer range on vite, so a major bump to
      # either alone is unresolvable: plugin-react 4 tops out at vite 7, and
      # plugin-react 6 requires vite 8. vitest is deliberately excluded — its
      # peer range already spans ^6 || ^7 || ^8, so it need not move in lockstep.
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
    # Same reasoning as the /backend entry: hold TypeScript majors for a
    # deliberate typescript-go migration. TS 7 already breaks the frontend build
    # (TS2882 on the side-effect import of styles.css in src/main.tsx).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Same treatment for React majors. Grouping made the 18 -> 19 update
      # resolvable (#141 installs cleanly) but not mergeable: React 19's types
      # drop the global JSX namespace, so the build fails with TS2503 until the
      # source is migrated. Hold majors until that is scoped deliberately; the
      # react group above stays active for grouped minor/patch updates.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  # Covers the third-party actions pinned in .github/workflows (checkout,
  # setup-node, gitleaks-action).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
