name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Type-Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Lint and format run before the audit, type-check and tests: they are
      # the cheapest steps and the likeliest to fail, so failing here gives
      # quicker feedback than the same failure surfacing after a full suite.
      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Check formatting
        working-directory: backend
        run: npm run format:check

      # Not a bare `npm audit`: that exits 1 both for real advisories and for
      # registry outages. See .github/scripts/audit-deps.mjs.
      - name: Audit dependencies
        run: node .github/scripts/audit-deps.mjs backend

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      # `test:coverage`, not `test`: the thresholds in backend/vitest.config.ts
      # only gate anything if the run that enforces them is the one CI executes.
      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:coverage

  frontend:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Same ordering rationale as the backend job: cheapest and most likely to
      # fail, so it runs before the build and the suite.
      #
      # `eslint .` exits 0 on warnings, so the five the frontend currently
      # reports do not fail this step: four react-hooks/set-state-in-effect
      # (App.tsx twice, SyncStatus.tsx, useSubscription.ts) tracked in #150,
      # and one react-refresh/only-export-components in TrendsView.tsx that is
      # not tracked anywhere yet.
      #
      # Leaving them non-fatal is deliberate. Raising set-state-in-effect to
      # error is #150's job, and wiring lint into CI should not silently import
      # that decision - the fixes change when a re-render happens in the live
      # update path, which is not something to land inside a CI plumbing PR.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      # Not a bare `npm audit`: that exits 1 both for real advisories and for
      # registry outages. See .github/scripts/audit-deps.mjs.
      - name: Audit dependencies
        run: node .github/scripts/audit-deps.mjs frontend --omit=dev

      - name: Build and type-check
        working-directory: frontend
        run: npm run build

      # Measures the palette in styles.css against WCAG AA. jsdom cannot
      # resolve cascaded colours, so axe in the test suite skips contrast and
      # this covers it instead.
      - name: Check colour contrast
        working-directory: frontend
        run: npm run audit:contrast

      # `test:coverage` for the same reason as the backend job. #149 predates
      # the frontend threshold, which landed later in #174, so the issue only
      # asked for the backend gate here; wiring both is what makes the
      # thresholds mean anything.
      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

  # `.github/scripts/audit-deps.mjs` is the security gate the two "Audit
  # dependencies" steps above run. It decides whether an npm audit failure
  # blocks the build, and to do that it has to tell a real advisory apart from
  # the registry never answering - two things npm reports with the same exit
  # code. Getting that wrong in the fail-open direction leaves a gate that
  # reports green while auditing nothing, which has happened once already
  # (ENOLOCK misclassified as an outage, caught before merge).
  #
  # Its own job rather than a step in the two above: .github/scripts/ belongs to
  # neither package, so bolting it onto one of them would imply an ownership
  # that does not exist, and it needs neither package's node_modules. Running in
  # parallel also means it adds no wall-clock to CI, which matters because the
  # suite spends ~30s in the script's real retry delays.
  scripts:
    name: Audit Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No cache: this job installs nothing. The tests use node:test and a
          # stub npm on PATH, so there is no lockfile to key a cache on.

      # No `npm ci` anywhere in this job. The suite stubs npm rather than
      # calling it, so it touches no network and needs no dependencies.
      #
      # Not covered by the Lint or Check formatting steps above: those run from
      # inside backend/ and frontend/, so .github/scripts/ is outside both. See
      # #180.
      - name: Run audit-deps regression tests
        run: node --test .github/scripts/audit-deps.test.mjs

  # Secret scanning lives in .github/workflows/secret-scan.yml, which pins and
  # checksum-verifies the scanner and runs on pushes to every branch rather than
  # only the ones that reach CI here.
