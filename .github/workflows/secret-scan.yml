name: Secret Scan

# Scans for committed credentials with Gitleaks.
#
# The scanner is fetched as a pinned release tarball and checked against the
# SHA-256 below before it is allowed to execute. The alternative -- a floating
# action tag, or curl piped straight into a shell -- means an executable runs in
# CI on trust alone, and whoever controls the tag or the download decides what
# that executable is. Verifying first turns a supply-chain question into an
# arithmetic one.
#
# Bumping the version means changing GITLEAKS_VERSION *and* GITLEAKS_SHA256
# together. Take the hash from the checksums file on the release page:
#   https://github.com/gitleaks/gitleaks/releases
# A version bump without the matching hash fails the job by design.

on:
  push:
    # Deliberately unfiltered. A credential pushed to a feature branch is
    # already in the remote and in every clone of it; waiting for the pull
    # request to open is waiting past the point where it is cheap to fix.
    branches: ['**']
  pull_request:
    branches: [main]

# The scan reads the repository and reports through the job's own status. It
# writes no comment, label, or commit, so it needs no write scope.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    # Load-bearing, and not just a label. A branch protection rule on main
    # requires a status check named "Secret Scan", and the context GitHub
    # publishes is the *job's* name -- not the workflow's. The job that used to
    # supply it lived in ci.yml; this one replaces it and has to keep reporting
    # under the same name, or protection waits forever on a check nothing
    # produces and every pull request is blocked. Renaming this means updating
    # the required check in the repository settings at the same time.
    name: Secret Scan
    runs-on: ubuntu-latest

    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The scan walks the commit range, not just the working tree, so a
          # secret added in one commit and deleted in a later one on the same
          # branch is still caught. That needs the whole history.
          fetch-depth: 0
          # Nothing here talks back to the API, so leaving a token behind in
          # .git/config would only widen what a compromised step could reach.
          persist-credentials: false

      - name: Download and verify gitleaks
        shell: bash
        run: |
          set -euo pipefail

          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"

          # Staged in its own directory so the download cannot land on top of a
          # repository file, and so a failed verification leaves nothing behind
          # that a later step could pick up by accident.
          workdir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-delay 2 \
            -o "${workdir}/${tarball}" "$url"

          # Checked with an explicit `if` rather than leaning on `set -e`. This
          # one comparison is the entire reason the job is trustworthy, and
          # `set -e` has enough exceptions -- and is easy enough to lose in a
          # later edit or a shell that does not honour it -- that the gate
          # should not be implicit. On a mismatch nothing is unpacked and
          # nothing is executed.
          if ! echo "${GITLEAKS_SHA256}  ${workdir}/${tarball}" \
               | sha256sum --check --strict -; then
            echo "::error::gitleaks ${GITLEAKS_VERSION} failed SHA-256 verification."
            echo "Expected: ${GITLEAKS_SHA256}"
            echo "Actual:   $(sha256sum < "${workdir}/${tarball}" | cut -d' ' -f1)"
            echo "The download was not what this workflow pinned. Refusing to run it."
            rm -rf "${workdir}"
            exit 1
          fi

          tar -xzf "${workdir}/${tarball}" -C "${workdir}" gitleaks
          install -m 0755 "${workdir}/gitleaks" /usr/local/bin/gitleaks
          rm -rf "${workdir}"

          gitleaks version

      - name: Scan repository history for secrets
        shell: bash
        # Non-zero exit on a finding is the whole point, so the default
        # --exit-code 1 stands. --redact keeps the secret itself out of the log:
        # run logs are readable by anyone with repository read access, and
        # reprinting a live credential there widens the leak instead of
        # containing it. The rule ID, file, and line are still reported, which
        # is what someone fixing it needs.
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
